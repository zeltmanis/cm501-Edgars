<div id="wrap">
  <header class="top">
    <div class="logo">Campus Café</div>
    <nav class="nav" aria-label="Main">
      <ul>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
  <h1 class="h">Contact</h1>
  <address>
    Example Street 1, 80000 Munich<br>
    Phone: <a href="tel:+498900000000">+49 89 000 000 00</a><br>
    E-mail: <a href="mailto:hello@campus-cafe.example">hello@campus-cafe.example</a>
  </address>
  <p><a href="https://www.google.com/maps/search/?api=1&amp;query=Example+Street+1+Munich">Show the café on Google Maps</a> (opens Google Maps)</p>

  <h2 class="h">Newsletter &amp; reservations</h2>
  <form action="https://campus-cafe.example/subscribe" method="post">
    <p>
      <label for="name">Name (required)</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
    </p>
    <p>
      <label for="email">E-mail (required)</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </p>
    <p>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" autocomplete="tel">
    </p>
    <p>
      <label for="msg">Message</label>
      <textarea id="msg" name="msg"></textarea>
    </p>
    <button type="submit" class="btn2">Send</button>
  </form>
